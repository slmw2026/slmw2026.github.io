# The banner is the original composed artwork with three text lines rewritten in
# place: the date now reads December 13, the "Accepted at" wording and the
# "Exact workshop day to be announced" note are gone. Everything else, including
# the illustration, the title and the subtitle, is the original pixel for pixel.
# The superseded banner is kept at /images/branding/slm-agents-banner.webp; the
# text-free illustration alone is at /images/branding/slm-agents-paris-art.webp.
# Because the wording is baked into the image, event_label, location and
# workshop_window above must be kept in step with it by hand.
hero:
  image: /images/branding/slm-agents-banner-dec13.webp
  width: 2172
  height: 724
  alt: SLM-Agents workshop banner with the Paris skyline and NeurIPS 2026 event details
