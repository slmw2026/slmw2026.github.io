# Where the workshop itself takes place. NeurIPS 2026 workshops in Paris are
# not at the main conference venue (Paris Congress Center), so the facts strip,
# the phone banner text and the schedule name the campus and room explicitly.
# The desktop banner image has venue_short and workshop_window baked in.
venue_short: Sorbonne University (Jussieu), Paris
venue_name: Sorbonne University, Jussieu Campus
venue_room: Amphitheater 34B
venue_address: 4 Place Jussieu, 75005 Paris
venue_map_url: https://www.openstreetmap.org/search?query=4%20Place%20Jussieu%2C%2075005%20Paris
workshop_window: December 13, 2026
event_label: NeurIPS 2026
submission_status: Submissions are now closed. Thank you to everyone who submitted.
# Submissions have closed. submissions_open: false hides the "Submit" call to
# action in the header and the Call for Papers, while submission_url is kept so
# readers can still reach the OpenReview venue page.
submissions_open: false
submission_url: https://openreview.net/group?id=NeurIPS.cc/2026/Workshop/SLM-Agents
# The fourth item of the facts strip under the banner. Update it as the
# workshop moves through its phases; remove it to fall back to the
# submissions open/closed status.
status_fact:
  label: Accepted papers
  text: View the list
  url: /accepted-papers/
# The strip under the facts row on the homepage. It now points poster
# presenters to the poster instructions on /authors/. Each item disappears once
# its date has passed (assets/js/important-dates.js), and the strip goes with
# the last one.
author_notice:
  label: Presenting a poster?
  url: /authors/#posters
  link_text: Poster instructions
  items:
    - text: "Portrait posters, at most 61 × 85 cm"
      date: 2026-12-13
    - text: NeurIPS print orders close November 30
      date: 2026-11-30
contact_status: 'For questions, contact the organizers at <a href="mailto:neurips.slmagents.2026@gmail.com">neurips.slmagents.2026@gmail.com</a>.'
non_archival_statement: Accepted workshop submissions are non-archival and may be submitted elsewhere after the workshop, subject to the policies of the other venue.
# The banner is the original composed artwork with its text lines rewritten in
# place: the date reads December 13, the "Accepted at" wording is gone, and
# (October 31) the location line "Paris, France" became two lines, the venue
# "Sorbonne University (Jussieu), Paris" with the pin and the date with a
# matching calendar icon, set in Inter like the original. Everything else,
# including the illustration, the title and the subtitle, is the original
# pixel for pixel. The previous banner is kept at
# /images/branding/slm-agents-banner-dec13.webp (it is the source for any
# further text edits); the text-free illustration alone is at
# /images/branding/slm-agents-paris-art.webp. Because the wording is baked into
# the image, event_label, venue_short and workshop_window must be kept in step
# with it by hand.
hero:
  image: /images/branding/slm-agents-banner-jussieu.webp
  width: 2172
  height: 724
  alt: "SLM-Agents workshop banner with the Paris skyline: NeurIPS 2026, Sorbonne University (Jussieu), Paris, December 13, 2026"
  # On phones the banner's built-in text is too small to read, so the text-free
  # illustration is shown instead and the title is set as live text below it.
  mobile_image: /images/branding/slm-agents-paris-art.webp
  mobile_width: 1600
  mobile_height: 900
