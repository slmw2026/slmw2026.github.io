{% if site.data.sponsors.size > 0 %}
  <div class="sponsors-grid" aria-label="Confirmed sponsors">
    {% for sponsor in site.data.sponsors %}
      <article class="sponsor-card">
        {% if sponsor.url %}<a href="{{ sponsor.url }}" target="_blank" rel="noopener noreferrer" aria-label="Visit {{ sponsor.name }}">{% endif %}
          <img src="{{ sponsor.logo | relative_url }}" alt="{{ sponsor.name }} logo" loading="lazy" decoding="async">
          <span class="sponsor-card__name">{{ sponsor.name }}</span>
        {% if sponsor.url %}</a>{% endif %}
      </article>
    {% endfor %}
  </div>
{% endif %}
